name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: The tag must equal the manifest version
        run: |
          v=$(node -p "require('./manifest.json').version")
          test "$v" = "${GITHUB_REF_NAME}" || { echo "manifest $v, tag ${GITHUB_REF_NAME}"; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
          generate_release_notes: true
